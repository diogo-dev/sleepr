version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 061705365347.dkr.ecr.us-east-2.amazonaws.com
  build:
    commands:
      - docker build -t sleepr/auth -f apps/auth/Dockerfile .
      - docker tag sleepr/auth:latest 061705365347.dkr.ecr.us-east-2.amazonaws.com/sleepr/auth:latest 

      - docker build -t sleepr/reservations -f apps/reservations/Dockerfile .
      - docker tag sleepr/reservations:latest 061705365347.dkr.ecr.us-east-2.amazonaws.com/sleepr/reservations:latest 

      - docker build -t sleepr/payments -f apps/payments/Dockerfile .
      - docker tag sleepr/payments:latest 061705365347.dkr.ecr.us-east-2.amazonaws.com/sleepr/payments:latest 

      - docker build -t sleepr/notifications -f apps/notifications/Dockerfile .
      - docker tag sleepr/notifications:latest 061705365347.dkr.ecr.us-east-2.amazonaws.com/sleepr/notifications:latest 
    post_build:
      commands:
        - docker push 061705365347.dkr.ecr.us-east-2.amazonaws.com/sleepr/auth:latest
        - docker push 061705365347.dkr.ecr.us-east-2.amazonaws.com/sleepr/reservations:latest
        - docker push 061705365347.dkr.ecr.us-east-2.amazonaws.com/sleepr/payments:latest
        - docker push 061705365347.dkr.ecr.us-east-2.amazonaws.com/sleepr/notifications:latest

      