apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - image: southamerica-east1-docker.pkg.dev/sleepr-492115/auth/production
          name: auth
          env:
          - name: JWT_EXPIRATION
            value: "3600"
          - name: HTTP_PORT
            value: "3003"
          - name: TCP_PORT
            value: "3002"
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: jwt
                key: jwtSecret
          - name: MONGODB_URI
            valueFrom:
              secretKeyRef:
                name: mongodb
                key: connectionString
          ports:
          - containerPort: 3002
          - containerPort: 3003