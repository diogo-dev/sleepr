services:
  e2e:
    build:
      dockerfile: ./Dockerfile
    volumes:
      - ./specs:/usr/src/app/specs
    depends_on:
      - reservation
      - auth
      - payments
      - notifications
      - mongo
  reservation:
    image: southamerica-east1-docker.pkg.dev/sleepr-492115/reservations/production
    env_file:
      - ../apps/reservations/.env
    ports:
      - "3000:3000"
  mongo: 
    image: mongo
  auth:
    image: southamerica-east1-docker.pkg.dev/sleepr-492115/auth/production
    env_file:
      - ../apps/auth/.env
    ports:
      - "3001:3001"
  payments:
    image: southamerica-east1-docker.pkg.dev/sleepr-492115/payments/production
    env_file:
      - ../apps/payments/.env
    ports:
     - "3003:3003"
  notifications:
    image: southamerica-east1-docker.pkg.dev/sleepr-492115/notifications/production
    env_file:
      - ../apps/notifications/.env
    ports:
      - "3004:3004"